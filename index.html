<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Список завдань</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"
    defer></script>
  <!-- <script src="js/data.js" defer></script> -->
  <!-- <script src="js/app.js" defer></script> -->
  <script src="dist/bundle.js" defer></script>
</head>

<body>
  <main class="py-4">
    <h1 class="text-center">Список завдань</h1>
    <hr>
    <div class="container">
      <div class="row">
        <div class="col-4">
          <h2>Створити завдання</h2>
          <hr>
          <form id="taskForm">
            <div class="mb-3">
              <label for="taskTitle" class="form-label">Назва</label>
              <input type="text" class="form-control" id="taskTitle" placeholder="Введіть назву завдання" required>
            </div>
            <div class="mb-3">
              <label for="taskDescription" class="form-label">Опис</label>
              <textarea class="form-control" id="taskDescription" placeholder="Введіть опис завдання"
                rows="4"></textarea>
            </div>
            <button type="submit" class="btn btn-success" disabled id="saveBtn">Зберегти</button>
          </form>
        </div>
        <div class="col-4">
          <h2>Завдання</h2>
          <hr>
          <ul class="list-group" id="taskList"></ul>
        </div>
      </div>
    </div>
  </main>
  <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="taskModalLabel">Назва завдання</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button>
        </div>
        <div class="modal-body" id="taskModalDescription">
          Опис завдання
        </div>
      </div>
    </div>
  </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to My Page!</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="d-flex justify-content-center my-4">
    <div class="card weather-card shadow-lg p-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Погода</h5>
        <select class="form-select form-select-sm w-auto" id="citySelect">
          <option value="Kyiv" selected>Київ</option>
          <option value="Lviv">Львів</option>
          <option value="Odesa">Одеса</option>
          <option value="Kharkiv">Харків</option>
          <option value="Dnipro">Дніпро</option>
        </select>
      </div>
      <div class="text-center mb-3">
        <img id="weatherIcon" src="http://openweathermap.org/img/wn/10d@4x.png" alt="Weather Icon"
          class="weather-icon" />
        <h2 class="fw-bold mb-0" id="temperature">--°C</h2>
        <p class="mb-0" id="weatherDescription">--</p>
      </div>
      <div class="row text-center">
        <div class="col">
          <small>Вологість</small>
          <div id="humidity">--%</div>
        </div>
        <div class="col">
          <small>Вітер</small>
          <div id="windSpeed">-- м/с</div>
        </div>
        <div class="col">
          <small>Тиск</small>
          <div id="pressure">-- гПа</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
